name: Build Survival Kernel

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for MT6877
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop make optipng pngcrush rsync schedtool squashfs-tools tar unzip libssl-dev libncurses-dev zlib1g-dev libtinfo6 lib32z1-dev device-tree-compiler python3 python3-pip

    - name: Download Clang Toolchain (Proton Clang)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git
        echo "PATH=$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        find . -name "*.sh" -exec chmod +x {} +
        chmod -R +x scripts/ tools/ || true
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/net/netfilter/xt_HL.c -O net/netfilter/xt_HL.c
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/net/netfilter/xt_TCPMSS.c -O net/netfilter/xt_TCPMSS.c
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/net/netfilter/xt_DSCP.c -O net/netfilter/xt_DSCP.c
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/net/netfilter/xt_MARK.c -O net/netfilter/xt_MARK.c
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/net/netfilter/xt_RATEEST.c -O net/netfilter/xt_RATEEST.c
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/net/netfilter/xt_CONNMARK.c -O net/netfilter/xt_CONNMARK.c
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/include/uapi/linux/netfilter/xt_CONNMARK.h -O include/uapi/linux/netfilter/xt_CONNMARK.h
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/include/uapi/linux/netfilter/xt_DSCP.h -O include/uapi/linux/netfilter/xt_DSCP.h
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/include/uapi/linux/netfilter/xt_MARK.h -O include/uapi/linux/netfilter/xt_MARK.h
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/include/uapi/linux/netfilter/xt_RATEEST.h -O include/uapi/linux/netfilter/xt_RATEEST.h
        wget https://raw.githubusercontent.com/torvalds/linux/v4.19/include/uapi/linux/netfilter/xt_TCPMSS.h -O include/uapi/linux/netfilter/xt_TCPMSS.h
        
        make O=out ARCH=arm64 CC=clang ruby_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
    - name: Package Kernel (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        elif [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image AnyKernel3/Image
        fi
        find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/dtb \; 2>/dev/null || true
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot/block=auto/g' anykernel.sh
        zip -r9 ../Survival-Kernel-Ruby.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Survival-Kernel-HyperOS
        path: Survival-Kernel-Ruby.zip
